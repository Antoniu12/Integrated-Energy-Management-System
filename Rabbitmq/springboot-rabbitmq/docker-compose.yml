version: '3'

services:
  db:
    image: mysql
    container_name: energy_db
    restart: always
    environment:
      MYSQL_DATABASE: 'energy-db'
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - "3309:3306"
    networks:
      - demo_net

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.1.0-beta.1-management
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - demo_net

  consumer-service:
    image: consumer-management
    container_name: consumer_management
    ports:
      - "8082:8082"
    environment:
      - DB_IP=db
      - DB_PORT=3306
      - DB_DBNAME=energy-db
      - DB_USER=root
      - DB_PASSWORD=root
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      - db
      - rabbitmq
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge
    external: true
